<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="200%" viewBox="0 0 300 300">
  <defs>
    <!-- Overall opacity mask -->
    <linearGradient id="fade" x1="0" y1="0.7" x2="0" y2="1">
      <stop offset="0%" stop-color="white" stop-opacity="1"/>
      <stop offset="50%" stop-color="white" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>

    <mask id="fadeMask">
      <rect width="100%" height="100%" fill="url(#fade)"/>
    </mask>

    <!-- Diamond Grid -->
    <pattern id="diamondGrid" width="20" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M 0 0 L 0 20 M 0 0 L 20 0"
            fill="none"
            stroke="#9CA3AF"
            stroke-width="1.5"
            stroke-opacity="0.9"/>
    </pattern>
  </defs>

  <!-- Entire SVG fades from top to bottom -->
  <rect
    width="100%"
    height="100%"
    fill="url(#diamondGrid)"
    mask="url(#fadeMask)"
  />
</svg>
